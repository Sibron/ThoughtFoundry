name: Backend checks

# The Supabase side, which `npm run build` never sees: every edge function is
# typechecked, and the migration directory is rebuilt from scratch and then
# re-applied. Runs on pull requests, and deploy-backend.yml calls it before
# anything is deployed, so a function that does not typecheck or a migration
# that does not apply cannot reach the project.

on:
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  edge-functions:
    name: Edge functions (deno check)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      # The glob picks up a new function without editing this file.
      - name: Typecheck every edge function
        run: deno check supabase/functions/*/index.ts

  migrations:
    name: Migrations (fresh build, then re-run)
    runs-on: ubuntu-latest
    services:
      postgres:
        # Postgres 17 with pgvector, matching the live project.
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Replay schema.sql and every migration, twice
        env:
          PGHOST: localhost
          PGUSER: postgres
          PGPASSWORD: postgres
        run: .github/scripts/replay-migrations.sh
